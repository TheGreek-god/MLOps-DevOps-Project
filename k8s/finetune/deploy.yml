apiVersion: apps/v1
kind: Deployment
metadata:
  name: finetune
  namespace: f1net
  labels:
    app: finetune
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finetune
  template:
    metadata:
      labels:
        app: finetune
    spec:
      containers:
        - name: finetune
          image: f1net-finetune:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: f1net-secrets
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-svc:5000"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/checkpoints
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: data
          hostPath:
            path: /mnt/data
            type: DirectoryOrCreate
        - name: checkpoints
          hostPath:
            path: /mnt/checkpoints
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: finetune-svc
  namespace: f1net
spec:
  selector:
    app: finetune
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30082
  type: NodePort
