apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: f1net
  labels:
    app: ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
        - name: ingest
          image: f1net-ingest:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: f1net-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: cache
              mountPath: /app/cache_folder
            - name: config
              mountPath: /app/config
            - name: checkpoints
              mountPath: /app/checkpoints
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: data
          hostPath:
            path: /mnt/data
            type: DirectoryOrCreate
        - name: cache
          hostPath:
            path: /mnt/cache_folder
            type: DirectoryOrCreate
        - name: config
          hostPath:
            path: /mnt/config
            type: DirectoryOrCreate
        - name: checkpoints
          hostPath:
            path: /mnt/checkpoints
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-svc
  namespace: f1net
spec:
  selector:
    app: ingest
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort
