apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: f1net
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: "ingest"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["f1net"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: ingest
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}
      - job_name: "predict"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["f1net"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: predict
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}
      - job_name: "finetune"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["f1net"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: finetune
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}
  targets.yml: |
    ingest-pod:
      - target: "ingest:8000"
    predict-pod:
      - target: "predict:8001"
    finetune-pod:
      - target: "finetune:8002"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: f1net
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: f1net
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: f1net
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: f1net
roleRef:
  kind: Role
  name: prometheus-pod-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: f1net
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=30d"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: f1net
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
