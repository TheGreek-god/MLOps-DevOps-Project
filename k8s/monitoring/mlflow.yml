apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-config
  namespace: f1net
data:
  MLFLOW_TRACKING_URI: "http://mlflow-svc:5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: f1net
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          args:
            - "mlflow"
            - "server"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "5000"
            - "--backend-store-uri"
            - "sqlite:///mlflow/mlflow.db"
            - "--default-artifact-root"
            - "/mlflow/artifacts"
          env:
            - name: MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE
              value: "true"
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: mlflow-data
          hostPath:
            path: /mnt/mlflow
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-svc
  namespace: f1net
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30050
  type: NodePort
