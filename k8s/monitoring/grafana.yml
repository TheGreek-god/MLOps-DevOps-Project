apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: f1net
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-svc:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: f1net
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: "F1Net Dashboards"
        orgId: 1
        folder: "F1Net"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-f1net
  namespace: f1net
data:
  f1net.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Service Health",
          "type": "stat",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "targets": [
            { "expr": "f1net_ingest_info{service=\"ingest\"}", "legendFormat": "Ingest", "refId": "A" },
            { "expr": "f1net_predict_info{service=\"predict\"}", "legendFormat": "Predict", "refId": "B" },
            { "expr": "f1net_finetune_info{service=\"finetune\"}", "legendFormat": "Finetune", "refId": "C" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          }
        },
        {
          "title": "API Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            { "expr": "rate(http_requests_total[1m])", "legendFormat": "{{method}} {{handler}} - {{status}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20 } },
            "overrides": []
          }
        },
        {
          "title": "API Latency (95th percentile)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            { "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))", "legendFormat": "{{handler}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 } },
            "overrides": []
          }
        },
        {
          "title": "Ingest Jobs",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 12 },
          "targets": [
            { "expr": "f1net_ingest_jobs_total", "legendFormat": "{{status}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20 } }, "overrides": [] }
        },
        {
          "title": "Rows Added (total)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 4, "x": 8, "y": 12 },
          "targets": [
            { "expr": "f1net_ingest_rows_added_total", "legendFormat": "Rows", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } },
            "overrides": []
          }
        },
        {
          "title": "Ingest Duration",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            { "expr": "rate(f1net_ingest_duration_seconds_sum[5m]) / rate(f1net_ingest_duration_seconds_count[5m])", "legendFormat": "Avg Duration", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 } }, "overrides": [] }
        },
        {
          "title": "Spearman Correlation (Pre vs Post Finetune)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 20 },
          "targets": [
            { "expr": "f1net_finetune_spearman_pre", "legendFormat": "Pre", "refId": "A" },
            { "expr": "f1net_finetune_spearman_post", "legendFormat": "Post", "refId": "B" }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 0.7 }] }
            },
            "overrides": []
          }
        },
        {
          "title": "Finetune Loss",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 20 },
          "targets": [
            { "expr": "f1net_finetune_loss", "legendFormat": "Loss", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20 } }, "overrides": [] }
        },
        {
          "title": "Finetune Jobs",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 20 },
          "targets": [
            { "expr": "f1net_finetune_jobs_total", "legendFormat": "{{status}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20 } }, "overrides": [] }
        },
        {
          "title": "Model Loaded",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 28 },
          "targets": [
            { "expr": "f1net_model_loaded{job=\"predict\"}", "legendFormat": "Predict", "refId": "A" },
            { "expr": "f1net_model_loaded{job=\"finetune\"}", "legendFormat": "Finetune", "refId": "B" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "options": { "0": { "text": "NOT LOADED" }, "1": { "text": "LOADED" } }, "type": "value" }],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          }
        },
        {
          "title": "Predict Duration",
          "type": "timeseries",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 28 },
          "targets": [
            { "expr": "rate(f1net_predict_duration_seconds_sum[5m]) / rate(f1net_predict_duration_seconds_count[5m])", "legendFormat": "Avg Duration", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 } }, "overrides": [] }
        }
      ],
      "schemaVersion": 33,
      "style": "dark",
      "tags": ["f1net", "mlops"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "F1Net MLOps Dashboard",
      "uid": "f1net-mlops",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: f1net
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "f1net"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-f1net
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-f1net
          configMap:
            name: grafana-dashboard-f1net
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: f1net
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
  type: NodePort
