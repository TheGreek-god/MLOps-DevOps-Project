apiVersion: v1
kind: Secret
metadata:
  name: f1net-secrets
  namespace: f1net
type: Opaque
# Secrets are created via kubectl create secret (not stored in git)
# See: kubectl create secret generic f1net-secrets -n f1net \
#   --from-literal=ADMIN_API_KEY=dev-key \
#   --from-literal=DAGSHUB_USERNAME=TheGreek-god \
#   --from-literal=DAGSHUB_TOKEN=<your-token> \
#   --from-literal=FINETUNE_API_URL=http://finetune-svc:8002/finetune \
#   --from-literal=FRONT_END_URL=http://localhost:30083
