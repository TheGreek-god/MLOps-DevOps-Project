services:
  ingest:
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
      - ./cache_folder:/app/cache_folder
      - ./config:/app/config
      - ./checkpoints:/app/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - f1net

  predict:
    build:
      context: .
      dockerfile: docker/predict.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - f1net

  finetune:
    build:
      context: .
      dockerfile: docker/finetune.Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - f1net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "80:80"
    networks:
      - f1net
    depends_on:
      predict:
        condition: service_healthy
      ingest:
        condition: service_healthy

networks:
  f1net:
    driver: bridge
