services:
  ingest:
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
      - ./cache_folder:/app/cache_folder
      - ./config:/app/config
      - ./.git:/app/.git
      - ./checkpoints:/app/checkpoints
      - ./.dvc:/app/.dvc
      - ./.dvcignore:/app/.dvcignore
    networks:
      - f1net

  predict:
    build:
      context: .
      dockerfile: docker/predict.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./config:/app/config
    networks:
      - f1net

  finetune:
    build:
      context: .
      dockerfile: docker/finetune.Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./config:/app/config
      - ./.git:/app/.git
      - ./.dvc:/app/.dvc
      - ./.dvcignore:/app/.dvcignore
    networks:
      - f1net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "80:80"
    networks:
      - f1net
    depends_on:
      - predict
      - ingest

networks:
  f1net:
    driver: bridge